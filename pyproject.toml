[tool.poetry]
name = "chainxplain"
version = "0.1.0"
description = "Production-grade AI-powered blockchain analysis toolkit with security scanning, REST API, and multi-chain support"
authors = ["Bharath Preetham <bharathpreetham.lilly@example.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/bharathpreetham-lilly/chainxplain"
repository = "https://github.com/bharathpreetham-lilly/chainxplain"
documentation = "https://github.com/bharathpreetham-lilly/chainxplain#readme"
keywords = [
    "blockchain", 
    "ethereum", 
    "smart-contracts", 
    "ai", 
    "mcp", 
    "claude",
    "security-analysis",
    "defi",
    "web3",
    "cryptocurrency",
    "fastapi",
    "vulnerability-scanner"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
    "Framework :: FastAPI",
]
packages = [{include = "chainxplain", from = "src"}]

[tool.poetry.scripts]
chainxplain = "chainxplain.cli.main:app"
chainxplain-mcp = "chainxplain.mcp.server:main"

[tool.poetry.dependencies]
python = "^3.10"

# === Core Framework ===
pydantic = "^2.0"
pydantic-settings = "^2.0"
python-dotenv = "^1.0"
typer = "^0.12"
rich = "^13.7"

# === MCP Server ===
fastmcp = "^0.2.0"

# === AI Integration ===
anthropic = "^0.30"
openai = {version = "^1.0", optional = true}

# === Blockchain Libraries ===
web3 = "^6.15"                 # Ethereum interactions
eth-abi = "^5.0"               # ABI encoding/decoding
eth-utils = "^4.0"             # Address validation, etc.

# === HTTP & Networking ===
httpx = "^0.27"
requests = "^2.31"
aiohttp = "^3.9"

# === Security Analysis (Optional) ===
slither-analyzer = {version = "^0.10", optional = true}

# === Utilities ===
ratelimit = "^2.2"
cachetools = "^5.3"
tenacity = "^8.2"
fastapi = "^0.121.0"
uvicorn = "^0.38.0"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
pytest-mock = "^3.12"
pytest-benchmark = "^4.0"
black = "^24.0"
ruff = "^0.3"
mypy = "^1.8"
pre-commit = "^3.6"
types-requests = "^2.31"
types-cachetools = "^5.3"
bandit = {extras = ["toml"], version = "^1.7"}
safety = "^3.0"
radon = "^6.0"
interrogate = "^1.5"
mkdocs = "^1.5"
mkdocs-material = "^9.5"
mkdocstrings = {extras = ["python"], version = "^0.24"}
mkdocs-gen-files = "^0.5"

[tool.poetry.extras]
openai = ["openai"]
security = ["slither-analyzer"]
all = ["openai", "slither-analyzer"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.isort]
known-third-party = ["anthropic", "web3", "eth_abi", "eth_utils"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "web3.*",
    "eth_abi.*",
    "eth_utils.*",
    "fastmcp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=chainxplain --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B601"]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
fail-under = 80
exclude = ["setup.py", "docs", "build", "tests"]
verbose = 0
quiet = false
color = true
