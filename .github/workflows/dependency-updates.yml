name: Auto-update Dependencies

on:
  schedule:
    # Run every Monday at 8 AM UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1

      - name: Update dependencies
        id: update
        run: |
          poetry update
          
          # Check if there are changes
          if git diff --quiet poetry.lock; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No dependency updates available"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            
            # Get list of updated packages
            UPDATED=$(git diff poetry.lock | grep -E '^\+.*name = ' | sed 's/^+.*name = "\(.*\)"/- \1/' | sort -u)
            echo "updated_packages<<EOF" >> $GITHUB_OUTPUT
            echo "$UPDATED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.update.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update dependencies"
          title: "chore: Weekly dependency updates"
          body: |
            ## 🔄 Automated Dependency Updates
            
            This PR updates the following packages:
            
            ${{ steps.update.outputs.updated_packages }}
            
            ### Review Checklist
            - [ ] Tests pass
            - [ ] No breaking changes
            - [ ] Security vulnerabilities addressed
            
            ---
            *Auto-generated by GitHub Actions*
          branch: chore/dependency-updates
          delete-branch: true
          labels: dependencies,automated

  update-github-actions:
    name: Update GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update GitHub Actions versions
        uses: actuated/versionbot@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
